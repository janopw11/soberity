name: soberity

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soberity
      POSTGRES_USER: soberity
      POSTGRES_PASSWORD: ${SOBERITY_DB_PASSWORD:?Set SOBERITY_DB_PASSWORD in infra/compose/.env (see .env.example)}
    ports:
      - '127.0.0.1:${SOBERITY_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soberity -d soberity']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ../../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/soberity
      SPRING_DATASOURCE_USERNAME: soberity
      SOBERITY_DB_PASSWORD: ${SOBERITY_DB_PASSWORD:?Set SOBERITY_DB_PASSWORD in infra/compose/.env (see .env.example)}
      SOBERITY_CORS_ALLOWED_ORIGINS: ${SOBERITY_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    ports:
      - '127.0.0.1::8080'
    stop_grace_period: 35s

volumes:
  postgres-data:
