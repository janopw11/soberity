name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'Staging HTTPS origin (no credentials, path or query)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
      - run: node scripts/check-staging.mjs "$STAGING_ORIGIN"
        env:
          STAGING_ORIGIN: ${{ inputs.origin }}
