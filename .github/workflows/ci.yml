name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_OFFLINE: '1'
      SOBERITY_DB_PASSWORD: ci-unused-demo-value
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:infra
      - run: pnpm --filter @soberity/consumer exec jest --runInBand --watchman=false
      - run: pnpm build
      - run: pnpm --filter @soberity/consumer export:native
      - run: pnpm --filter @soberity/consumer exec playwright install --with-deps chromium --only-shell
      - run: pnpm --filter @soberity/consumer test:web
      - name: Verify generated checks did not change the lockfile
        run: git diff --exit-code -- pnpm-lock.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: web-test-failures
          path: apps/consumer/test-results/
          retention-days: 3

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend
      - name: Build backend container without publishing
        run: docker build --tag soberity-backend:ci backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/failsafe-reports/TEST-*.xml
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history with redacted output
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --log-opts="--all"
