<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soberity — zatwierdzone motywy</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --bg: #211b2a;
        --surface: #2a2235;
        --alt: #342a43;
        --primary: #c1a4f6;
        --text: #f1ecf8;
        --secondary: #d0c2e0;
        --border: #5b4a6c;
      }
    </style>

  <body>
    <main>
      <h1>Zatwierdzone motywy Soberity</h1>
      <p>
        Decyzja właściciela 2026-11-01: domyślna jaśniejsza Śliwka, alternatywny
        jasny fioletowo-biały.
      </p>
      <p>
        <a class="text-link" href="index.html?screen=home&lang=pl"
          >Otwórz wzorzec z przełącznikiem ↗</a
        >
      </p>
      <section class="color-comparison">
        <h2>Ciemny — Śliwka</h2>
        <p>Zatwierdzony motyw domyślny · jaśniejsza Śliwka</p>
        <div class="comparison-images">
          <a href="screenshots/plum-soft-desktop.png"
            ><img
              src="screenshots/plum-soft-desktop.png"
              alt="Ciemny — Śliwka — desktop" /></a
          ><a href="screenshots/plum-soft-mobile.png"
            ><img
              src="screenshots/plum-soft-mobile.png"
              alt="Ciemny — Śliwka — mobile"
          /></a>
        </div>
      </section>
      <section class="color-comparison">
        <h2>Jasny — Fiolet</h2>
        <p>Zatwierdzony motyw jasny · fiolet i biel</p>
        <div class="comparison-images">
          <a href="screenshots/violet-desktop.png"
            ><img
              src="screenshots/violet-desktop.png"
              alt="Jasny — Fiolet — desktop" /></a
          ><a href="screenshots/violet-mobile.png"
            ><img
              src="screenshots/violet-mobile.png"
              alt="Jasny — Fiolet — mobile"
          /></a>
        </div>
