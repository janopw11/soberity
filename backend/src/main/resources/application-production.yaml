spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

soberity:
  cors:
    allowed-origins: ${SOBERITY_CORS_ALLOWED_ORIGINS}
  firebase:
    project-id: ${SOBERITY_FIREBASE_PROJECT_ID}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
