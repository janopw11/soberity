spring:
  application:
    name: soberity-backend
  threads:
    virtual:
      enabled: true
  mvc:
    log-request-details: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.jdbc.core: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.web.method.HandlerMethod: INFO
  structured:
    format:
      console: ecs

# Nearby coordinates are accepted only in POST bodies; no request/body/SQL bind logging.
soberity:
  events:
    nearby-radius-km: ${SOBERITY_EVENTS_NEARBY_RADIUS_KM:100}
