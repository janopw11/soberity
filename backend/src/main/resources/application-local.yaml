spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soberity}
    username: ${SPRING_DATASOURCE_USERNAME:soberity}
    password: ${SOBERITY_DB_PASSWORD}

soberity:
  cors:
    allowed-origins: ${SOBERITY_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
